name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Výchozí práva jsou jen pro čtení; zápis do Pages má pouze job `deploy`,
# který nespouští žádný kód z npm/PyPI.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m starquake_extract extract --out out
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm --prefix game ci
      - run: npm --prefix game test
      - run: npm --prefix game run build
      - run: python -m pytest
      - run: npm --prefix game run pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
